name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          pkg=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$pkg"; exit 1; }
      - name: Build every target
        run: |
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            bun scripts/build.ts --target "bun-$target" --outfile "dist/agentmeter-$target"
          done
          cd dist
          for f in agentmeter-*; do sha256sum "$f" > "$f.sha256"; done
          ls -la
      - name: Smoke test the Linux x64 binary
        run: ./dist/agentmeter-linux-x64 version && COLUMNS=120 ./dist/agentmeter-linux-x64 --once --dir test/fixtures
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "agentmeter ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/agentmeter-*
