name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Render the fixtures once
        run: COLUMNS=120 bun src/cli.tsx --once --dir test/fixtures
      - name: Compact line from the fixtures
        run: bun src/cli.tsx --compact --dir test/fixtures
      - name: Build the host binary
        run: bun scripts/build.ts && ./dist/agentmeter version
